metadata:
  created_by: Lauge Naur Hansen
  created_at: 2026-06-02
  version: 2.0

# transfer is not a model class — it is detected programmatically by matching
# amounts across accounts within a date window before inference runs.
rule_based:
  - name: transfer
    description: Internal transfer between own bank accounts

# These Spiir categories are excluded from training data entirely.
# Udlæg: reimbursements — any description can appear here, no learnable signal.
# Ignorer: explicit user tag in Spiir.
excluded_spiir:
  - Udlæg
  - Ignorer
  - Kontooverførsel

# Transactions whose cleaned description matches any of these regex patterns
# are routed to manual review — neither trained on nor inferred by the model.
# MobilePay: recipient is a person name, no learnable category signal in text.
manual_review_patterns:
  - "^mobilepay"

# Predictions with max softmax probability below this threshold are not
# auto-labeled — they go to manual review as "unknown".
# Above 0.70: ~78% of transactions at 98% accuracy on current data.
# Raise to route more conservatively; lower to accept more auto-labels.
inference_confidence_threshold: 0.70

# sure.am parent categories — import these first so child categories resolve.
sure_am_parents:
